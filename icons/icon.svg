<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3A2214"/>
      <stop offset=".55" stop-color="#140C08"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="body" cx="40%" cy="32%" r="75%">
      <stop offset="0" stop-color="#FFB27A"/>
      <stop offset=".45" stop-color="#F58A45"/>
      <stop offset="1" stop-color="#D9601F"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2A27"/>
      <stop offset="1" stop-color="#151311"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6EC"/>
      <stop offset="1" stop-color="#EADBCB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- soft shadow -->
  <ellipse cx="256" cy="440" rx="130" ry="18" fill="#000" opacity=".55"/>
  <!-- body / head -->
  <path d="M256 128c86 0 140 58 140 150 0 92-56 154-140 154s-140-62-140-154c0-92 54-150 140-150z" fill="url(#body)"/>
  <!-- tummy highlight -->
  <ellipse cx="222" cy="200" rx="48" ry="26" fill="#fff" opacity=".18" transform="rotate(-18 222 200)"/>
  <!-- cheeks -->
  <ellipse cx="180" cy="300" rx="22" ry="13" fill="#FF6B5A" opacity=".45"/>
  <ellipse cx="332" cy="300" rx="22" ry="13" fill="#FF6B5A" opacity=".45"/>
  <!-- eyes -->
  <ellipse cx="206" cy="262" rx="30" ry="36" fill="#fff"/>
  <ellipse cx="306" cy="262" rx="30" ry="36" fill="#fff"/>
  <circle cx="212" cy="270" r="18" fill="#1A1412"/>
  <circle cx="300" cy="270" r="18" fill="#1A1412"/>
  <circle cx="219" cy="262" r="6.5" fill="#fff"/>
  <circle cx="307" cy="262" r="6.5" fill="#fff"/>
  <!-- smile -->
  <path d="M232 318c12 16 36 16 48 0" fill="none" stroke="#5A2410" stroke-width="9" stroke-linecap="round"/>
  <!-- book held in front -->
  <g transform="translate(256 392)">
    <path d="M-86 -30 L0 -18 L86 -30 L86 30 L0 42 L-86 30 Z" fill="#7A2E0E"/>
    <path d="M-78 -36 L-2 -24 L-2 34 L-78 22 Z" fill="url(#book)"/>
    <path d="M78 -36 L2 -24 L2 34 L78 22 Z" fill="url(#book)"/>
    <path d="M-64 -18 L-16 -10 M-64 -2 L-16 6 M16 -10 L64 -18 M16 6 L64 -2" stroke="#E0B894" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- little hands on the book -->
  <ellipse cx="160" cy="378" rx="22" ry="18" fill="#E8722F"/>
  <ellipse cx="352" cy="378" rx="22" ry="18" fill="#E8722F"/>
  <!-- graduation cap -->
  <g transform="rotate(-8 256 130)">
    <path d="M196 132 Q256 156 316 132 L316 168 Q256 190 196 168 Z" fill="url(#cap)"/>
    <path d="M256 74 L384 122 L256 170 L128 122 Z" fill="url(#cap)"/>
    <path d="M256 74 L384 122 L256 170 L128 122 Z" fill="none" stroke="#3E3833" stroke-width="3"/>
    <circle cx="256" cy="122" r="9" fill="#FFC845"/>
    <path d="M256 122 Q330 128 348 150 L348 198" fill="none" stroke="#FFC845" stroke-width="6" stroke-linecap="round"/>
    <path d="M338 194 h20 l6 30 h-32 z" fill="#FFC845"/><path d="M338 194 h20 v6 h-20z" fill="#E0A020"/>
  </g>
